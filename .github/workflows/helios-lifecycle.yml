name: Helios lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'helios/**'
      - 'selene/**'
      - 'selene-manager/**'
      - 'eos/**'
      - 'verification/helios-lifecycle/**'
      - '.github/workflows/helios-lifecycle.yml'
  pull_request:
    paths:
      - 'helios/**'
      - 'selene/**'
      - 'selene-manager/**'
      - 'eos/**'
      - 'verification/helios-lifecycle/**'
      - '.github/workflows/helios-lifecycle.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Download TLA+ tools
        run: curl --fail --location --retry 2 --output "$RUNNER_TEMP/tla2tools.jar" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: Check lifecycle model and Rust conformance
        run: python3 verification/helios-lifecycle/check.py --tlc-jar "$RUNNER_TEMP/tla2tools.jar"

  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Protobuf compiler
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler
      - name: Install Kani
        run: cargo install --locked kani-verifier --version 0.68.0
      - name: Set up Kani compiler
        run: cargo kani setup
      - name: Prove sequential validator properties
        run: cargo kani --manifest-path helios/Cargo.toml --lib

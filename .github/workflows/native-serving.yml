name: Native serving

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  native:
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Prepare external frontend test fixtures
        run: |
          python -m pip install huggingface-hub==1.33.0
          python tests/frontend/prepare_templates.py --output "${{ runner.temp }}/flare-test-templates" --recipe gemma4 --recipe glm53 --recipe mimo_v2 --recipe nemotron_h --recipe qwen38 --recipe step5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm protobuf-compiler libssl-dev liburing-dev
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc nasm --yes --no-progress
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native serving
        id: build
        run: cargo build --locked --release --manifest-path flare-cli/Cargo.toml
      - name: Test host OS helpers
        run: cargo test --locked --release --manifest-path eos/Cargo.toml --target-dir flare-cli/target
      - name: Test Selene and its manager on Linux
        if: runner.os == 'Linux'
        run: |
          cargo test --locked --release --manifest-path selene/Cargo.toml --features test-support --target-dir flare-cli/target
          cargo test --locked --release --manifest-path selene-manager/Cargo.toml --features test-support --target-dir flare-cli/target
      - name: Test host cache tiers on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked --release --manifest-path selene/Cargo.toml --target-dir flare-cli/target
      - name: Test native runtime on Linux
        if: runner.os == 'Linux'
        env:
          FLARE_TEST_TEMPLATE_DIR: ${{ runner.temp }}/flare-test-templates
        run: |
          ulimit -l
          sudo prlimit --pid $$ --memlock=67108864:67108864
          cargo test --locked --release --manifest-path helios/Cargo.toml --target-dir flare-cli/target --features runtime-core,server
      - name: Test native runtime on Windows
        if: runner.os == 'Windows'
        env:
          FLARE_TEST_TEMPLATE_DIR: ${{ runner.temp }}/flare-test-templates
        run: cargo test --locked --release --manifest-path helios/Cargo.toml --target-dir flare-cli/target --features runtime-core,server
      - name: Test native CLI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLARE_TEST_TEMPLATE_DIR: ${{ runner.temp }}/flare-test-templates
        run: cargo test --locked --release --manifest-path flare-cli/Cargo.toml
      - name: Test shared application workflows
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          FLARE_TEST_TEMPLATE_DIR: ${{ runner.temp }}/flare-test-templates
        run: cargo test --locked --release --manifest-path flare/Cargo.toml --target-dir flare-cli/target
      - name: Exercise native Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = '.\flare-cli\target\release\flare.exe'
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "$exe --help failed" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "$exe --version failed" }
          & $exe agent
          if ($LASTEXITCODE -eq 0) { throw "$exe accepted unsupported multi-host serving" }
          exit 0
      - name: Package Windows executable and license notices
        if: runner.os == 'Windows'
        run: |
          rustup component add rust-docs
          python packaging/archive.py --binary flare-cli/target/release/flare.exe --target ${{ matrix.target }} --output flare-windows-native.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: runner.os == 'Windows'
        with:
          name: flare-windows-native
          path: flare-windows-native.zip

  rdma:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install RDMA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang libclang-dev pkg-config protobuf-compiler libnl-3-dev libnl-route-3-dev libibverbs-dev librdmacm-dev liburing-dev
      - name: Compile experimental RDMA
        run: |
          cargo check --locked --manifest-path selene/Cargo.toml --tests --features rdma
          cargo check --locked --manifest-path selene-manager/Cargo.toml --tests --features rdma
          cargo check --locked --manifest-path flare-cli/Cargo.toml --tests --features roce,rdma

  python-boundary-and-hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check shell and Python syntax
        run: |
          git ls-files -z '*.sh' | xargs -0 -n 1 bash -n
          git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Install Heliopause build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm protobuf-compiler libssl-dev liburing-dev
      - name: Install Python test dependencies and Heliopause
        env:
          MATURIN_PEP517_ARGS: --locked
        run: |
          python -m pip install 'pytest>=9,<10' 'cryptography>=46,<52' 'protobuf>=7.36.2,<8' 'rich>=13' 'safetensors==0.8.0' numpy 'maturin>=1.9,<2' 'setuptools>=77'
          python -m pip install --no-deps --no-build-isolation ./heliopause
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run CLI and core-boundary tests
        run: python -m pytest tests/cli tests/preparation/test_core_boundary.py -q
